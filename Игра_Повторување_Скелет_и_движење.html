<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Повторување Скелет и движење</title>
<style>
:root{--navy:#153252;--blue:#2d7fb8;--sky:#e7f5fc;--yellow:#ffd95a;--green:#27855f;--mint:#e4f5ec;--red:#d84238;--coral:#fde9e5;--ink:#17202a;--muted:#5b6875;--line:#cad8e4;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--ink);background:#f5f8fb}body{min-height:100vh}
header{min-height:84px;background:var(--navy);color:white;border-bottom:8px solid var(--yellow);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 24px}.brand{font-size:28px;font-weight:900}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.badge,.topbtn{font-size:19px;font-weight:800;border-radius:16px;padding:11px 16px}.badge{background:white;color:var(--navy)}.topbtn{background:transparent;color:white;border:2px solid white;cursor:pointer}
main{max-width:1250px;margin:0 auto;padding:20px 28px 30px}.eyebrow{text-align:center;font-size:20px;letter-spacing:1px;color:var(--blue);font-weight:900}.question{text-align:center;color:var(--navy);font-size:40px;line-height:1.12;font-weight:900;max-width:1100px;margin:8px auto 18px}.board{display:grid;grid-template-columns:38% 62%;gap:26px;align-items:center}.visual{height:410px;background:white;border:3px solid var(--line);border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px #17365d16}.icon{font-size:150px;filter:drop-shadow(0 10px 9px #17365d22)}.side{display:flex;flex-direction:column;gap:14px}.choices{display:grid;gap:13px}.choice{min-height:76px;border:3px solid var(--blue);background:white;color:var(--navy);border-radius:20px;font-size:28px;font-weight:900;padding:12px 18px;cursor:pointer;box-shadow:0 5px 0 #a9cce1;touch-action:manipulation}.choice:active{transform:translateY(4px);box-shadow:0 1px 0 #a9cce1}.choice.good{background:var(--mint);border-color:var(--green);color:#155a42}.choice.bad{background:var(--coral);border-color:var(--red);color:#8c271f;animation:shake .28s}.feedback{min-height:100px;border-radius:18px;background:#edf1f5;padding:15px 18px;font-size:22px;font-weight:700;line-height:1.25}.feedback.ok{background:var(--mint);color:#155a42}.feedback.no{background:var(--coral);color:#8c271f}.next{width:100%;border:0;border-radius:14px;background:var(--green);color:white;font-size:23px;font-weight:900;padding:13px;margin-top:12px;cursor:pointer}.finish{max-width:850px;margin:60px auto;background:white;border:3px solid var(--line);border-radius:28px;text-align:center;padding:45px 25px}.finish .cup{font-size:90px}.finish h2{font-size:48px;color:var(--navy);margin:8px}.finish p{font-size:26px}.restart{border:0;border-radius:16px;background:var(--blue);color:white;font-size:27px;font-weight:900;padding:17px 28px;cursor:pointer}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:850px){header{align-items:flex-start;flex-direction:column}.board{grid-template-columns:1fr}.visual{height:230px}.icon{font-size:100px}.question{font-size:31px}.choice{font-size:23px;min-height:62px}}
</style>
</head>
<body>
<header><div class="brand">СКЕЛЕТ И ДВИЖЕЊЕ</div><div class="tools"><span class="badge" id="progress"></span><span class="badge" id="score"></span><button class="topbtn" onclick="readQuestion()">🔊 ПРОЧИТАЈ</button><button class="topbtn" onclick="fullScreen()">⛶ ЦЕЛ ЕКРАН</button></div></header>
<main id="app"></main>
<script>
const QUESTIONS=[{"icon":"🐕","q":"Како се движи кучето?","options":["ОДИ И ТРЧА","ПЛИВА","ЛЕТА"],"answer":0,"ok":"Кучето оди и трча.","hint":"Кучето се движи по копно со четири нозе."},{"icon":"🐟","q":"Како се движи рибата?","options":["СКОКА","ПЛИВА","ЛЕТА"],"answer":1,"ok":"Рибата плива.","hint":"Рибата се движи во вода со перки."},{"icon":"🦋","q":"Како се движи пеперутката?","options":["ЛЕТА","ПЛИВА","ОДИ И ТРЧА"],"answer":0,"ok":"Пеперутката лета.","hint":"Пеперутката се движи во воздух со крилја."},{"icon":"🪱","q":"Како се движи црвот?","options":["ПОЛЗИ","ЛЕТА","СКОКА"],"answer":0,"ok":"Црвот ползи и го извива телото.","hint":"Црвот нема нозе и се движи по подлогата."},{"icon":"🦘","q":"Како се движи кенгурот?","options":["ПЛИВА","СКОКА","ЛЕТА"],"answer":1,"ok":"Кенгурот скока со силните задни нозе.","hint":"Кенгурот има долги и силни задни нозе."},{"icon":"🩻","q":"Каде се наоѓа скелетот кај човекот?","options":["ВО ВНАТРЕШНОСТА НА ТЕЛОТО","НАДВОР ОД ТЕЛОТО"],"answer":0,"ok":"Скелетот е во внатрешноста на телото.","hint":"Кожата и мускулите ги покриваат коските."},{"icon":"🦴","q":"Од што е составен скелетот?","options":["ОД КОСКИ","ОД МУСКУЛИ","ОД КОЖА"],"answer":0,"ok":"Скелетот е составен од поврзани коски.","hint":"Помисли на тврдите делови во телото."},{"icon":"🩻","q":"Од што е составен ’рбетот?","options":["ОД РЕБРА","ОД ПРШЛЕНИ","ОД МУСКУЛИ"],"answer":1,"ok":"’Рбетот е составен од поврзани пршлени.","hint":"Тоа се малите поврзани коски по средината на грбот."},{"icon":"💪","q":"Какви се коските на рацете?","options":["ДОЛГИ","КРАТКИ"],"answer":0,"ok":"Коските на рацете се долги.","hint":"Погледни ја должината од рамото до дланката."},{"icon":"🦵","q":"Какви се коските на нозете?","options":["КРАТКИ","ДОЛГИ"],"answer":1,"ok":"Коските на нозете се долги.","hint":"Погледни ја должината од колкот до стапалото."},{"icon":"✋","q":"Какви се коските на дланките?","options":["КРАТКИ","ДОЛГИ"],"answer":0,"ok":"Коските на дланките се кратки.","hint":"Во дланката има повеќе мали коски."},{"icon":"🦶","q":"Какви се коските на стапалата?","options":["ДОЛГИ","КРАТКИ"],"answer":1,"ok":"Коските на стапалата се кратки.","hint":"Во стапалото има повеќе мали коски."},{"icon":"🔗","q":"Како се вика местото каде што се спојуваат две коски и се овозможува движење?","options":["ЗГЛОБ","ЧЕРЕП","РЕБРО"],"answer":0,"ok":"Тоа место се вика зглоб.","hint":"Во зглобот коските се спојуваат и можат да се движат."},{"icon":"🦵","q":"Кое од овие е зглоб?","options":["КОЛЕНО","СРЦЕ"],"answer":0,"ok":"Коленото е зглоб.","hint":"Избери место каде што се спојуваат коски."},{"icon":"💪","q":"Кои две места се зглобови?","options":["ЛАКТОТ И РАМОТО","ЧЕРЕПОТ И РЕБРАТА"],"answer":0,"ok":"Лактот и рамото се зглобови.","hint":"Размисли каде раката може да се свитка или да се движи."}];
let index=0,score=0,firstTry=true,locked=false;
function fullScreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}}
function speak(text){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='mk-MK';u.rate=.86;speechSynthesis.speak(u)}}
function readQuestion(){if(index<QUESTIONS.length){const q=QUESTIONS[index];speak(q.q+' '+q.options.join('. '))}}
function render(){
  if(index>=QUESTIONS.length){
    document.getElementById('progress').textContent='ЗАВРШЕНО';
    document.getElementById('score').textContent='ПОЕНИ: '+score;
    document.getElementById('app').innerHTML='<section class="finish"><div class="cup">🏆</div><h2>Браво!</h2><p>Освои <b>'+score+'</b> од <b>'+QUESTIONS.length+'</b> поени од прв обид.</p><p>Подготвени сме за новите поими.</p><button class="restart" onclick="restart()">ИГРАЈ ОДНОВО</button></section>';
    return;
  }
  firstTry=true;locked=false;
  const q=QUESTIONS[index];
  document.getElementById('progress').textContent=(index+1)+' / '+QUESTIONS.length;
  document.getElementById('score').textContent='ПОЕНИ: '+score;
  document.getElementById('app').innerHTML='<div class="eyebrow">ПОГЛЕДНИ · РАЗМИСЛИ · ДОПРИ</div><div class="question">'+q.q+'</div><section class="board"><div class="visual"><div class="icon" role="img" aria-label="Илустрација">'+q.icon+'</div></div><div class="side"><div class="choices">'+q.options.map((o,i)=>'<button class="choice" onclick="answer('+i+',this)">'+o+'</button>').join('')+'</div><div class="feedback" id="feedback">Избери го точниот одговор.</div></div></section>';
}
function answer(choice,button){
  if(locked)return;
  const q=QUESTIONS[index],fb=document.getElementById('feedback');
  if(choice===q.answer){
    locked=true;button.classList.add('good');if(firstTry)score++;
    document.getElementById('score').textContent='ПОЕНИ: '+score;
    fb.className='feedback ok';fb.innerHTML='✓ '+q.ok+'<button class="next" onclick="nextQuestion()">СЛЕДНО ПРАШАЊЕ</button>';speak('Точно. '+q.ok);
  }else{
    firstTry=false;button.classList.add('bad');setTimeout(()=>button.classList.remove('bad'),350);
    fb.className='feedback no';fb.textContent='Обиди се повторно. '+q.hint;speak('Обиди се повторно. '+q.hint);
  }
}
function nextQuestion(){index++;render()}
function restart(){index=0;score=0;render()}
render();
</script>
</body></html>
